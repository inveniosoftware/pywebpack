[project]
name = "pywebpack"
description = "Webpack integration layer for Python."
readme = "README.rst"
requires-python = ">=3.7"
license = "BSD-3-Clause"
authors = [
  { name = "CERN", email = "info@inveniosoftware.org" },
]
keywords = [
  "node",
  "npm",
  "webpack",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
]
dependencies = [
  "pynpm>=0.1.0",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/inveniosoftware/pywebpack"

[project.optional-dependencies]
docs = []
tests = [
  "pytest-black>=0.3.0",
  "pytest-cache>=1.0",
  "pytest-invenio>=4.0.0,<5.0.0",
  "sphinx>=4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pywebpack/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/pywebpack",
]

[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = "D401"

[tool.pytest.ini_options]
addopts = '--black --isort --pydocstyle --doctest-glob="*.rst" --doctest-modules --cov=pywebpack --cov-report=term-missing'
testpaths = "tests pywebpack"
live_server_scope = "module"
